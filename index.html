<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>no-nonogram</title>
  <!-- No third-party host on the first-paint path. Playfair Display used to arrive from
       Google Fonts over two preconnects and a render-blocking stylesheet, which meant the
       deploy artifact was not complete on its own: behind a firewall the request failed
       and the wordmark fell back without a word (DOO-40). It is now a `@font-face` in
       style.css over ui/fonts/, so a grep of this artifact for a foreign host finds
       nothing — including here. -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <linearGradient id="cube-top-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#faeac0" />
        <stop offset="1" stop-color="#eccf8e" />
      </linearGradient>
      <linearGradient id="cube-left-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d9b06e" />
        <stop offset="1" stop-color="#b78f4c" />
      </linearGradient>
      <linearGradient id="cube-right-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a17f42" />
        <stop offset="1" stop-color="#7c5f2e" />
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <section id="screen-main" class="screen hub">
      <div class="brand">
        <svg class="cube-mark" viewBox="0 0 100 116" aria-hidden="true">
          <path d="M50 0 L100 29 L50 58 L0 29 Z" fill="url(#cube-top-grad)" />
          <path d="M0 29 L50 58 L50 116 L0 87 Z" fill="url(#cube-left-grad)" />
          <path d="M100 29 L50 58 L50 116 L100 87 Z" fill="url(#cube-right-grad)" />
        </svg>
        <div>
          <h1>no-nonogram</h1>
          <p class="subtitle">3D 노노그램</p>
        </div>
        <button class="menu-btn" id="btn-start">시작하기</button>
      </div>
    </section>

    <section id="screen-levels" class="screen hub" hidden>
      <header class="topbar">
        <button class="icon-btn" id="btn-levels-back" title="뒤로">←</button>
        <h2 class="screen-title">레벨 선택</h2>
      </header>
      <div id="levels-grid" class="card-grid"></div>
    </section>

    <section id="screen-puzzles" class="screen hub" hidden>
      <header class="topbar">
        <button class="icon-btn" id="btn-puzzles-back" title="뒤로">←</button>
        <h2 class="screen-title" id="puzzles-title">Level 1</h2>
      </header>
      <div id="puzzles-grid" class="card-grid"></div>
    </section>

    <section id="screen-game" class="screen" hidden>
      <header class="band band--top band--split">
        <div class="puzzle-info">
          <span id="dims-label" class="dims"></span>
        </div>
        <div class="band-actions">
          <!-- A one-finger drag has to mean exactly one thing, so rotate-vs-paint is an
               explicit switch rather than something guessed from where the drag began
               (ui/gestures.js explains why guessing fails on a 6³ board). Desktop also
               has `P` and hold-Shift; this button is the only way in on touch. -->
          <button id="btn-mode" class="mode-btn" type="button" aria-pressed="false"
                  title="칠하기 모드 (P) — 끌어서 연속 채움">
            <span class="mode-btn__icon" aria-hidden="true">✥</span>
            <span class="mode-btn__text">회전</span>
          </button>
          <button id="btn-game-back" class="tag-btn" type="button" title="메뉴로" aria-label="메뉴로 돌아가기">☰</button>
        </div>
      </header>

      <div id="board">
        <!-- Three clue tables do not fit beside a board on a phone, so every viewport
             narrower than the three-panel frame shows one table at a time and picks it
             with these tabs. `ui/clues.js` keeps the selection on the axis the camera
             is looking along, so in normal play the right table is already open and the
             tabs cost nothing; it also adds/removes the tablist ARIA roles as the
             layout crosses the breakpoint, because they only describe the tabbed mode. -->
        <div id="clue-tabs" class="clue-tabs">
          <button class="clue-tab" type="button" data-axis="y" id="clue-tab-y">
            <span class="clue-tab__axis"><span class="axis-dot axis-dot--y" aria-hidden="true"></span>Y</span>
            <small>x × z</small>
          </button>
          <button class="clue-tab" type="button" data-axis="x" id="clue-tab-x">
            <span class="clue-tab__axis"><span class="axis-dot axis-dot--x" aria-hidden="true"></span>X</span>
            <small>y × z</small>
          </button>
          <button class="clue-tab" type="button" data-axis="z" id="clue-tab-z">
            <span class="clue-tab__axis"><span class="axis-dot axis-dot--z" aria-hidden="true"></span>Z</span>
            <small>x × y</small>
          </button>
        </div>

        <div class="clue-panel clue-panel--top" id="clue-panel-y">
          <h2><span class="axis-dot axis-dot--y" aria-hidden="true"></span>Y <small>(x × z)</small></h2>
          <div id="clues-y" class="clue-grid"></div>
        </div>
        <div class="clue-panel clue-panel--left" id="clue-panel-x">
          <h2><span class="axis-dot axis-dot--x" aria-hidden="true"></span>X <small>(y × z)</small></h2>
          <div id="clues-x" class="clue-grid"></div>
        </div>
        <div class="clue-panel clue-panel--right" id="clue-panel-z">
          <h2><span class="axis-dot axis-dot--z" aria-hidden="true"></span>Z <small>(x × y)</small></h2>
          <div id="clues-z" class="clue-grid"></div>
        </div>
        <canvas id="scene"></canvas>
      </div>

      <footer class="band band--bottom">
        <button id="undo" class="tag-btn" title="되돌리기">↺</button>

        <!-- The depth cursor (render/peel.js) peels the front layers off the box so an
             interior cell becomes a full cell-sized target instead of a sliver between
             the cells in front of it. It shipped on `[`/`]` alone, which is to say it
             did not exist on touch and nobody on desktop had a reason to find it — this
             stepper is the affordance, and `ui/peel.js` explains why the readout names
             the axis and sometimes two of them. -->
        <div id="peel" class="peel" role="group" aria-label="깊이 커서 — 앞쪽 레이어 벗기기" data-peeled="0">
          <button id="peel-less" class="peel__btn" type="button" aria-label="한 겹 덮기 ([)">−</button>
          <!-- The readout doubles as "back to the whole board", which is `\` on desktop
               and otherwise unreachable without pressing − all the way down. Disabled,
               not hidden, at depth 0 so the pill never changes width. -->
          <button id="peel-readout" class="peel__readout" type="button" aria-label="벗긴 겹 없음" disabled>
            <!-- Dot and letter are one box so the landscape rail can stack the readout
                 into three rows (axis / depth / next axis) without the dot orphaning
                 onto a line of its own. The letter is never dropped: hue alone would
                 make the axis invisible to a colour-blind player. -->
            <span class="peel__axis">
              <span class="axis-dot axis-dot--x" id="peel-dot"></span><span id="peel-axis">X</span>
            </span>
            <span class="peel__depth" id="peel-depth">0/0</span>
            <span class="peel__next" id="peel-next" aria-hidden="true" style="visibility: hidden">
              <span class="peel__arrow">→</span>
              <span class="axis-dot axis-dot--z" id="peel-next-dot"></span>
              <span id="peel-next-axis">Z</span>
            </span>
          </button>
          <button id="peel-more" class="peel__btn" type="button" aria-label="한 겹 벗기기 (])">+</button>
          <span id="peel-live" class="sr-only" aria-live="polite"></span>
        </div>

        <div id="status"></div>

        <!-- Anchored by CSS to the band above `#peel` (`.band` is the positioned
             ancestor), so there is nothing to measure and nothing to keep in sync when
             the landscape clause stands the band up on its side. -->
        <div id="peel-coach" class="peel-coach" role="status" hidden>
          <p class="peel-coach__text">
            5³부터는 <b>속이 가려져</b> 안쪽 칸을 누를 수가 없다.
            <b>깊이 커서</b>로 보고 있는 쪽 겹을 벗기면 안쪽 칸이 제 크기로 드러난다.
          </p>
          <button id="peel-coach-close" class="peel-coach__close" type="button">알겠어요</button>
        </div>
      </footer>
    </section>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
